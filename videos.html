<!DOCTYPE html>
<html>
<head>
    <title>My AI Videos</title>

    <style>
        body {
            background: #262626;
            color: white;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            color: #00E5FF;
        }

        .gallery {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .video-card {
            width: 300px;
        }

        video {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>My AI Videos</h1>

    <div class="gallery">

        <div class="video-card">
            <video controls>
                <source src="ai-video1.mp4" type="video/mp4">
            </video>
            <h3>AI Video 1</h3>
        </div>

        <div class="video-card">
            <video controls>
                <source src="ai-video2.mp4" type="video/mp4">
            </video>
            <h3>AI Video 2</h3>
        </div>

        <div class="video-card">
            <video controls>
                <source src="ai-video3.mp4" type="video/mp4">
            </video>
            <h3>AI Video 3</h3>
        </div>

        <div class="video-card">
            <video controls>
                <source src="ai-video4.mp4" type="video/mp4">
            </video>
            <h3>AI Video 4</h3>
        </div>

    </div>

</body>
</html>
